[general]
version = "0.7.0"
time_zone = "utc-6"

[network]
server_address = "0.0.0.0"
postgres_port = 5432
http_port = 23820
client_port = 23817
connection_pool_size = 32

[log]
log_filename = "infinity.log"
log_dir = "/var/infinity/log"
log_to_stdout = true
log_file_max_size = "50MB"
log_file_rotate_count = 3
log_level = "warning"

[storage]
persistence_dir = "/var/infinity/persistence"
data_dir = "/var/infinity/data"
optimize_interval = "30s"
cleanup_interval = "120s"
compact_interval = "300s"
storage_type = "local"
mem_index_capacity = 16384

[buffer]
buffer_manager_size = "512MB"
lru_num = 3
temp_dir = "/var/infinity/tmp"
result_cache = "off"
memindex_memory_quota = "256MB"

[wal]
wal_dir = "/var/infinity/wal"

[resource]
