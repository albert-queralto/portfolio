  reverse-proxy:
    container_name: albert-reverse-proxy
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      portfolio:
        condition: service_healthy
      # chat-api:
      #   condition: service_started
      # ragflow:
      #   condition: service_started
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx-host-albertqueralto.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    mem_limit: 64m
    cpus: 0.20
    security_opt:
      - no-new-privileges:true
    networks:
      - web
      - payrithm-network

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

networks:
  web:
    driver: bridge
  payrithm-network:
    external: true
    name: payrithm_default

