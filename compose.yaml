services:
  portfolio:
    container_name: albert-portfolio
    image: albert-portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80"
    security_opt:
      - no-new-privileges:true
    networks:
      - web
  
  reverse-proxy:
    container_name: albert-reverse-proxy
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - portfolio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-host-albertqueralto.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - web

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

networks:
  web:
    driver: bridge