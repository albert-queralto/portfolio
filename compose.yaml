services:
  portfolio:
    container_name: albert-portfolio
    image: albert-portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    mem_limit: 96m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    networks:
      - web

