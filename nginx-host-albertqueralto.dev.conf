limit_req_zone $binary_remote_addr zone=chat_api:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name albertqueralto.dev www.albertqueralto.dev ollama.albertqueralto.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.albertqueralto.dev;

    ssl_certificate /etc/letsencrypt/live/albertqueralto.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/albertqueralto.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://albertqueralto.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name albertqueralto.dev;

    ssl_certificate /etc/letsencrypt/live/albertqueralto.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/albertqueralto.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/chat {
        limit_req zone=chat_api burst=3 nodelay;
        proxy_pass http://chat-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
    }

    location / {
        proxy_pass http://portfolio:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ollama.albertqueralto.dev;

    ssl_certificate /etc/letsencrypt/live/albertqueralto.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/albertqueralto.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 12m;

    location / {
        proxy_pass http://ollama-auth:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_buffering off;
    }
}
