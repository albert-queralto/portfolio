# ============================================================
# www -> canonical portfolio domain
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.albertqueralto.dev;

    ssl_certificate /etc/letsencrypt/live/albertqueralto.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/albertqueralto.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://albertqueralto.dev$request_uri;
}


# ============================================================
# Portfolio
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name albertqueralto.dev;

    ssl_certificate /etc/letsencrypt/live/albertqueralto.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/albertqueralto.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        set $portfolio_upstream portfolio:80;
        proxy_pass http://$portfolio_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}


# ============================================================
# Catalonia Weather App
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name catalonia-weather-app.albertqueralto.dev;

    ssl_certificate /etc/letsencrypt/live/albertqueralto.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/albertqueralto.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://host.docker.internal:2080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}


