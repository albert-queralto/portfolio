resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $host $canonical_https_host {
    default $host;
    www.albertqueralto.dev albertqueralto.dev;
}


# ============================================================
# Catalonia Weather application exposed internally on :2080
# ============================================================

server {
    listen 2080 default_server;
    listen [::]:2080 default_server;

    server_name 91.99.58.122;

    return 301 https://catalonia-weather-app.albertqueralto.dev$request_uri;
}


# ============================================================
# HTTP -> HTTPS for existing applications
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name
        albertqueralto.dev
        www.albertqueralto.dev
        payrithm.albertqueralto.dev
        catalonia-weather-app.albertqueralto.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$canonical_https_host$request_uri;
    }
}


# ============================================================
# TenderWise HTTP -> HTTPS
# Keep ACME challenge available for certificate renewal
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name tenderwise.albertqueralto.dev;

    location /.well-known/acme-challenge/ {
